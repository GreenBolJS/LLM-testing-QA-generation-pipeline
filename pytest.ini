[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    requires_network: test needs live internet access (EDGAR, Groq, or HF) — skipped by default
    requires_model: test needs to download/load the local bge-small-en-v1.5 embedding model — skipped by default
# Excluded by default since both require network access (downloading the
# embedding model, or live API calls). Run explicitly with:
#   pytest -m requires_model
#   pytest -m requires_network
addopts = -m "not requires_model and not requires_network"
